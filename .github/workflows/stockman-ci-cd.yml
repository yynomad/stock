name: StockMan CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify source release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build release archive
        run: |
          mkdir dist
          python scripts/vps.py package --output dist/source.tar.gz
          (cd dist && sha256sum source.tar.gz > source.tar.gz.sha256)
      - name: Verify packaged release
        run: |
          mkdir -p "$RUNNER_TEMP/stockman-release"
          tar -xzf dist/source.tar.gz -C "$RUNNER_TEMP/stockman-release"
          bash "$RUNNER_TEMP/stockman-release/scripts/vps_install.sh"
      - name: Show verification logs on failure
        if: failure()
        run: |
          for log in "$RUNNER_TEMP"/stockman-release/acceptance/*.log; do
            if [[ -f "$log" ]]; then
              echo "==> $log"
              tail -n 80 "$log"
            fi
          done
      - name: Save verified release
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: stockman-${{ github.sha }}
          path: |
            dist/source.tar.gz
            dist/source.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Install and verify on Oracle
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.STOCKMAN_AUTO_DEPLOY == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: oracle-test
    concurrency:
      group: stockman-oracle-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: stockman-${{ github.sha }}
          path: dist
      - name: Deploy the verified archive over SSH
        env:
          STOCKMAN_SSH_HOST: ${{ vars.STOCKMAN_SSH_HOST }}
          STOCKMAN_SSH_PORT: ${{ vars.STOCKMAN_SSH_PORT || '22' }}
          STOCKMAN_SSH_KEY: ${{ secrets.STOCKMAN_SSH_KEY }}
          STOCKMAN_SSH_KNOWN_HOSTS: ${{ vars.STOCKMAN_SSH_KNOWN_HOSTS }}
        run: |
          : "${STOCKMAN_SSH_HOST:?Set STOCKMAN_SSH_HOST in oracle-test}"
          : "${STOCKMAN_SSH_KEY:?Set STOCKMAN_SSH_KEY in oracle-test}"
          : "${STOCKMAN_SSH_KNOWN_HOSTS:?Set STOCKMAN_SSH_KNOWN_HOSTS in oracle-test}"
          (cd dist && sha256sum --check source.tar.gz.sha256)
          umask 077
          mkdir -p "$HOME/.ssh"
          key_file="$(mktemp "$RUNNER_TEMP/stockman-ssh.XXXXXX")"
          trap 'rm -f "$key_file"' EXIT
          printf '%s\n' "$STOCKMAN_SSH_KEY" > "$key_file"
          printf '%s\n' "$STOCKMAN_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          unset STOCKMAN_SSH_KEY
          python3 scripts/vps.py deploy \
            --host "$STOCKMAN_SSH_HOST" --port "$STOCKMAN_SSH_PORT" \
            --identity "$key_file" --archive dist/source.tar.gz
